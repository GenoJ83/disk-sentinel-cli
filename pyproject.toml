[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "disk-sentinel-cli"
version = "0.1.0"
description = "CLI disk space analyzer, duplicate file finder, and cache cleaner"
authors = [{ name = "Geno Joshua" }]
requires-python = ">=3.9"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
